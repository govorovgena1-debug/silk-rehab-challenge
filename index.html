<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0A0807">
<title>Состязание мастеров — SILK REHAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0A0807; --panel:rgba(242,234,224,.028); --line:rgba(199,154,107,.2);
    --gold:#C79A6B; --gold-2:#E3C49E; --cream:#F2EAE0; --muted:#8A7F74; --warn:#C07A62;
    --serif:Georgia,"Iowan Old Style","Times New Roman",Times,serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{min-height:100vh;color:var(--cream);font-family:var(--sans);font-size:15px;line-height:1.5;
    background:radial-gradient(90% 45% at 50% -8%,rgba(199,154,107,.13),rgba(10,8,7,0) 62%),var(--bg);
    background-attachment:fixed}
  .app{max-width:480px;margin:0 auto;padding:26px 20px 116px}

  .brand{font-size:11px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
  .cover{position:relative;margin:18px 0 0}
  .cover:before{content:"";position:absolute;inset:-34px;pointer-events:none;
    background:radial-gradient(58% 46% at 50% 42%,rgba(199,154,107,.17),rgba(10,8,7,0) 72%)}
  .cover img{position:relative;width:100%;display:block;border:1px solid var(--line);animation:fade .9s ease both}
  @keyframes fade{from{opacity:0;transform:scale(1.012)}to{opacity:1;transform:scale(1)}}
  .meta{display:flex;align-items:center;gap:13px;margin:18px 0 0;
    font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
  .meta b{color:var(--gold);font-weight:600;white-space:nowrap}
  .meta em{flex:1 1 auto;height:1px;background:var(--line)}
  .meta span{white-space:nowrap}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px 18px;margin-top:18px}
  .panel__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .label{font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
  .sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:right}

  /* вход */
  .hi{margin-top:26px}
  .hi h1{margin:0 0 10px;font-family:var(--serif);font-size:31px;font-weight:400;line-height:1.15;color:var(--cream)}
  .hi p{margin:0 0 26px;font-size:14px;color:var(--muted);line-height:1.6}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:none;color:var(--muted);
    font:inherit;font-size:11.5px;cursor:pointer;transition:border-color .2s,color .2s}
  .chip:active,.chip--on{border-color:var(--gold);color:var(--cream)}
  .rule{margin-top:24px;padding:17px 16px;border:1px solid var(--line);border-radius:4px;
    background:linear-gradient(180deg,rgba(199,154,107,.08),rgba(199,154,107,0))}
  .rule p{margin:10px 0 0;font-size:13px;color:var(--cream);line-height:1.65}
  .rule p+p{margin-top:9px;color:var(--muted)}

  /* напоминание */
  .alert{margin-top:18px;padding:17px 16px;border:1px solid rgba(199,154,107,.5);border-radius:4px;
    background:linear-gradient(180deg,rgba(199,154,107,.11),rgba(199,154,107,.02))}
  .alert p{margin:10px 0 15px;font-size:13px;color:var(--cream);line-height:1.6}
  .alert p b{color:var(--gold-2);font-weight:600}

  /* прогресс */
  .score{display:flex;align-items:baseline;gap:9px;margin-top:15px;font-family:var(--serif)}
  .score b{font-size:66px;font-weight:400;line-height:.86;letter-spacing:-.025em;color:var(--cream)}
  .score span{font-size:22px;color:var(--gold)}
  .tally{display:flex;align-items:flex-end;height:44px;margin:20px 0 15px}
  .t{flex:1 1 0;height:100%;display:flex;align-items:flex-end;justify-content:center}
  .t:after{content:"";display:block;width:2px;height:21px;border-radius:1px;background:rgba(242,234,224,.13)}
  .t--major:after{height:32px}
  .t--on:after{background:linear-gradient(180deg,var(--gold-2),var(--gold));
    box-shadow:0 0 11px rgba(199,154,107,.45);transform-origin:bottom;animation:light .5s ease both}
  @keyframes light{from{opacity:0;transform:scaleY(.15)}to{opacity:1;transform:scaleY(1)}}
  .hint{font-size:13px;color:var(--muted);line-height:1.55}
  .hint b{color:var(--cream);font-weight:600}
  .goal{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
  .goal p{margin:8px 0 0;font-size:13.5px;color:var(--cream);line-height:1.55}

  /* достижения */
  .ach{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}
  .ach__i{border:1px solid var(--line);border-radius:4px;padding:17px 12px;text-align:center;
    background:none;color:inherit;font:inherit;cursor:pointer;transition:border-color .25s,background .25s}
  .ach__i--on{border-color:rgba(199,154,107,.55);background:linear-gradient(180deg,rgba(199,154,107,.1),rgba(199,154,107,0))}
  .ach__ic{width:36px;height:36px;margin:0 auto 11px;display:block;opacity:.32;transition:opacity .25s}
  .ach__i--on .ach__ic{opacity:1;filter:drop-shadow(0 0 9px rgba(199,154,107,.45))}
  .ach__t{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.6}
  .ach__i--on .ach__t{color:var(--cream)}
  .ach__n{display:block;margin-top:9px;font-family:var(--serif);font-size:21px;color:var(--gold)}
  .ach__hint{margin-top:13px;font-size:11px;color:var(--muted);text-align:center}

  /* метрики */
  .mhead{display:grid;grid-template-columns:1fr 76px 76px;gap:9px;padding:16px 0 11px;
    font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .mrow{display:grid;grid-template-columns:1fr 76px 76px;gap:9px;padding:13px 0;border-top:1px solid var(--line)}
  .mhead span:not(:first-child),.mrow .mval{text-align:right}
  .mk b{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .mk small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
  .mval{font-family:var(--serif);font-size:17px;color:var(--cream)}
  .mval em{display:block;margin-top:4px;font-style:normal;font-family:var(--sans);font-size:11px;color:var(--gold)}
  .mval em.down{color:var(--warn)}
  .msum{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.65}
  .msum b{color:var(--cream);font-weight:600}
  .mempty{margin:15px 0 16px;font-size:13px;color:var(--muted);line-height:1.6}

  /* рейтинг */
  .row{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0;padding-top:16px}
  .rank{flex:0 0 22px;font-family:var(--serif);font-size:15px;color:var(--gold)}
  .thumb{flex:0 0 38px;width:38px;height:38px;object-fit:cover;border:1px solid var(--line);border-radius:2px}
  .who{flex:1 1 auto;min-width:0}
  .nm{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--cream)}
  .mark{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .mark--you{color:var(--muted)}
  .line{height:2px;background:rgba(242,234,224,.08);margin-top:10px;overflow:hidden}
  .line i{display:block;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
  .cnt{flex:0 0 auto;font-family:var(--serif);font-size:19px;color:var(--cream)}
  .cnt span{font-size:12px;color:var(--muted);font-family:var(--sans)}
  .prize{margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}
  .prize p{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
  .arow{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:13.5px}
  .arow em{flex:0 0 18px;font-style:normal;font-family:var(--serif);font-size:13px;color:var(--gold)}
  .arow b{flex:1 1 auto;font-weight:400;color:var(--cream)}
  .arow i{font-style:normal;font-family:var(--serif);font-size:15px;color:var(--cream)}

  /* отметки */
  .post{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  .post:first-of-type{border-top:0;padding-top:16px}
  .pnum{flex:0 0 22px;font-family:var(--serif);font-size:14px;color:var(--gold)}
  .pdate{flex:1 1 auto;min-width:0;font-size:14px;color:var(--cream)}
  .pdate small{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plink{flex:0 0 auto;border:0;background:none;color:var(--gold);font:inherit;font-size:10px;
    font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:8px 0 8px 8px}
  .empty{padding:16px 0 2px;font-size:13.5px;color:var(--muted);line-height:1.6}

  /* идеи */
  .idea{display:flex;gap:13px;padding:15px 0;border-top:1px solid var(--line)}
  .idea:first-of-type{border-top:0;padding-top:6px}
  .idea b{flex:0 0 20px;font-family:var(--serif);font-size:14px;font-weight:400;color:var(--gold)}
  .idea div{flex:1 1 auto}
  .idea strong{display:block;margin-bottom:5px;font-size:14px;font-weight:600;color:var(--cream);line-height:1.4}
  .idea small{font-size:12.5px;color:var(--muted);line-height:1.6}

  /* кнопки */
  .cta-wrap{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:16px 20px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(10,8,7,0),rgba(10,8,7,.94) 40%,var(--bg))}
  .cta{display:block;width:100%;max-width:440px;margin:0 auto;height:54px;border:0;border-radius:3px;
    background:linear-gradient(100deg,#B98A5A,#E3C49E 52%,#C79A6B);color:#14100C;font:inherit;
    font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;transition:opacity .18s}
  .cta:active{opacity:.82}
  .cta[disabled]{background:none;border:1px solid var(--line);color:var(--muted);cursor:default}
  .cta--sm{height:46px;font-size:11px;letter-spacing:.22em;max-width:none}
  .alt{display:block;width:100%;height:46px;margin-top:11px;border:1px solid var(--line);border-radius:3px;
    background:none;color:var(--gold);font:inherit;font-size:10px;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;cursor:pointer}
  .alt:active{border-color:var(--gold-2)}

  /* шторка */
  .backdrop{position:fixed;inset:0;background:rgba(5,4,3,.72);opacity:0;pointer-events:none;
    transition:opacity .3s ease;z-index:30}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(102%);
    transition:transform .38s cubic-bezier(.2,.8,.2,1)}
  .sheet__in{max-width:480px;margin:0 auto;background:#100D0B;border-top:1px solid var(--line);
    padding:26px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
  .open .backdrop{opacity:1;pointer-events:auto}
  .open .sheet{transform:translateY(0)}
  .sheet h2{margin:10px 0 8px;font-family:var(--serif);font-size:24px;font-weight:400;color:var(--cream)}
  .sheet p{margin:0 0 22px;font-size:13px;color:var(--muted);line-height:1.6}
  .fgroup{margin-bottom:20px}
  .fgroup label{display:block;margin-bottom:7px;font-size:9.5px;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold)}
  .field{width:100%;height:50px;background:none;border:0;border-bottom:1px solid rgba(199,154,107,.42);
    border-radius:0;color:var(--cream);font:inherit;font-size:16px;outline:0;padding:0 2px;transition:border-color .2s}
  .field::placeholder{color:#5F574F}
  .field:focus{border-bottom-color:var(--gold-2)}
  .field.err{border-bottom-color:var(--warn)}
  .msg{min-height:17px;margin:10px 2px 20px;font-size:12px;color:var(--warn)}
  .ghost{display:block;width:100%;height:44px;margin-top:8px;border:0;background:none;color:var(--muted);
    font:inherit;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  .check{display:flex;align-items:flex-start;gap:12px;width:100%;margin:2px 0 20px;padding:0;
    background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .check i{flex:0 0 20px;width:20px;height:20px;margin-top:1px;border:1px solid var(--line);border-radius:2px;
    display:grid;place-items:center;transition:border-color .2s,background .2s}
  .check--on i{border-color:var(--gold);background:linear-gradient(100deg,#B98A5A,#E3C49E)}
  .check i svg{width:12px;height:12px;opacity:0;transition:opacity .2s}
  .check--on i svg{opacity:1}
  .check span{font-size:12.5px;color:var(--muted);line-height:1.5}
  .check--on span{color:var(--cream)}

  .toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);z-index:40;max-width:88%;
    display:flex;align-items:center;gap:11px;padding:13px 20px;border-radius:3px;background:#100D0B;
    border:1px solid var(--line);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--cream);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .toast i{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block;flex:0 0 5px}
  .toast.show{transform:translate(-50%,0)}

  .skel{margin-top:18px}
  .skel div{height:13px;background:linear-gradient(90deg,rgba(242,234,224,.05),rgba(242,234,224,.11),rgba(242,234,224,.05));
    background-size:200% 100%;animation:sh 1.4s linear infinite;margin-bottom:12px}
  .skel div:nth-child(1){width:38%} .skel div:nth-child(2){width:100%;height:260px} .skel div:nth-child(3){width:64%}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  .notice{display:flex;align-items:center;gap:12px;margin-top:16px;padding:13px 15px;border-radius:3px;
    border:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
  .notice button{margin-left:auto;flex:0 0 auto;border:0;background:none;color:var(--gold);font:inherit;
    font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:6px 0}

  /* выбор участника */
  .pick{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:15px 16px;
    border:1px solid var(--line);border-radius:4px;background:none;color:inherit;font:inherit;
    text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
  .pick--on{border-color:var(--gold);background:linear-gradient(180deg,rgba(199,154,107,.1),rgba(199,154,107,0))}
  .pick b{flex:1 1 auto;font-size:15px;font-weight:400;color:var(--cream)}
  .pick small{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .pick i{flex:0 0 18px;width:18px;height:18px;border:1px solid var(--line);border-radius:50%;
    display:grid;place-items:center;transition:border-color .2s,background .2s}
  .pick--on i{border-color:var(--gold);background:linear-gradient(100deg,#B98A5A,#E3C49E)}
  .pick i svg{width:10px;height:10px;opacity:0;transition:opacity .2s}
  .pick--on i svg{opacity:1}
  .role{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .linkbtn{display:block;width:100%;margin-top:14px;padding:6px 0;border:0;background:none;color:var(--muted);
    font:inherit;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
  .cat{display:block;margin-bottom:6px;font-size:9px;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold)}

  :focus-visible{outline:1px solid var(--gold-2);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="brand">SILK REHAB</div>
  <div class="skel"><div></div><div></div><div></div></div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet__in" id="sheetIn"></div></div>
<div class="toast" id="toast"><i></i><span id="toastText"></span></div>

    });
    goalEl.addEventListener('input',function(){ goalEl.classList.remove('err'); msg.textContent=''; });
    document.getElementById('hGo').addEventListener('click',function(){
      if(!picked){ msg.textContent='Выбери себя из списка.'; return; }
      var gl=goalEl.value.trim();
      if(gl.length<3){ goalEl.classList.add('err'); msg.textContent='Опиши цель или выбери готовую ниже.'; goalEl.focus(); return; }
      join(picked,gl);
    });
    var rt=document.getElementById('retry');
    if(rt) rt.addEventListener('click',function(){ location.reload(); });
  }

  function join(id,goal){
    var p=byId(id); if(!p) return;
    p.goal=goal; state.me=id;
    store('silk_me',id); store('silk_goal',goal);
    load(mineKey(id),function(raw){
      restoreMine(raw);
      p.goal=goal;
      saveMine();
      render(); toast('Ты в списке · '+p.name);
    });
  }
  function leave(){
    forget('silk_me'); forget('silk_goal');
    state.me=''; picked=''; render();
  }


  /* ---------- главный экран ---------- */
  function render(){
    if(!state.me){ renderPick(); return; }

    var c=state.challenge, goal=c.goal, me=getMe(), cp=state.checkpoints, ms=measure();
    var left=c.endDate?daysTo(c.endDate,true):null;
    var sorted=state.participants.slice().sort(function(a,b){return b.count-a.count;});
    var byAch=state.participants.slice().sort(function(a,b){return achTotal(b)-achTotal(a);});
    var top=sorted.length?sorted[0].count:0;
    var place=sorted.indexOf(me)+1;
    var remain=Math.max(0,goal-me.count);
    var perDay=(left&&left>0&&remain)?Math.ceil(remain/left):0;

    var when=!ms.started?('старт '+fmtDate(c.startDate)+' · через '+ms.toStart+' '+plural(ms.toStart,'день','дня','дней'))
            :(left===null?'':left>0?(left+' '+plural(left,'день','дня','дней')+' до финиша')
            :left===0?'финиш сегодня':'челлендж завершён');

    var pace;
    if(remain===0){ pace='<b>Цель закрыта.</b> '+goal+' из '+goal+'.'; }
    else if(!ms.started){ pace='Старт '+fmtDate(c.startDate)+'. Цель — <b>'+goal+' '+plural(goal,'рилс','рилса','рилсов')+'</b>.'; }
    else if(left===null||left<=0){ pace='Осталось <b>'+remain+' '+plural(remain,'рилс','рилса','рилсов')+'</b>.'; }
    else { pace='Осталось <b>'+remain+' '+plural(remain,'рилс','рилса','рилсов')+'</b> на '+left+' '+
                plural(left,'день','дня','дней')+' — по '+perDay+' в день.'; }

    var ticks='';
    for(var i=0;i<goal;i++){
      var on=i<me.count, major=((i+1)%5===0);
      ticks+='<span class="t'+(major?' t--major':'')+(on?' t--on':'')+'"'+
             (on?' style="animation-delay:'+Math.min(i*26,700)+'ms"':'')+'></span>';
    }

    var mrows='',msum='';
    if(cp.length){
      mrows='<div class="mhead"><span>Замер</span><span>Подписчики</span><span>Охваты</span></div>';
      for(var q=0;q<cp.length;q++){
        var p=cp[q],prev=q?cp[q-1]:null;
        var df=prev?p.followers-prev.followers:null, dr=prev?p.reach-prev.reach:null;
        mrows+='<div class="mrow"><span class="mk"><b>'+(q===0?'Старт':'Неделя '+q)+'</b><small>'+fmtDate(p.date)+'</small></span>'+
          '<span class="mval">'+num(p.followers)+(df===null?'':'<em class="'+(df<0?'down':'')+'">'+delta(df)+'</em>')+'</span>'+
          '<span class="mval">'+num(p.reach)+(dr===null?'':'<em class="'+(dr<0?'down':'')+'">'+delta(dr)+'</em>')+'</span></div>';
      }
      if(cp.length>1){
        var f0=cp[0],fN=cp[cp.length-1],gf=fN.followers-f0.followers,gr=fN.reach-f0.reach;
        var pf=f0.followers?Math.round(gf/f0.followers*100):null;
        msum='<div class="msum">За челлендж: <b>'+delta(gf)+' '+plural(Math.abs(gf),'подписчик','подписчика','подписчиков')+'</b>'+
          (pf!==null?' ('+(pf>0?'+':'')+pf+'%)':'')+', охваты <b>'+delta(gr)+'</b>.</div>';
      }
    } else {
      mrows='<div class="mempty">Стартовые показатели ещё не внесены. Запиши, сколько подписчиков и охватов было на старте — от этих цифр будем считать результат.</div>'+
            '<button class="cta cta--sm" id="m1">Внести стартовые данные</button>';
    }

    var rows='';
    for(var j=0;j<sorted.length;j++){
      var pp=sorted[j],w=top?Math.round(pp.count/Math.max(top,goal)*100):0;
      var lp=lastPoint(pp.id);
      var lpTxt=lp?(num(lp.followers)+' '+plural(lp.followers,'подписчик','подписчика','подписчиков')+' · '+num(lp.reach)+' охватов'):'замеров ещё нет';
      rows+='<div class="row" data-who="'+esc(pp.id)+'" role="button" tabindex="0" style="cursor:pointer"><span class="rank">'+two(j+1)+'</span>'+
        (pp.photo?'<img class="thumb" src="'+esc(pp.photo)+'" alt="">':'')+
        '<div class="who"><span class="nm">'+esc(pp.name)+
          (pp.role?'<span class="role">'+esc(pp.role)+'</span>':'')+
          ((j===0&&top>0)?'<span class="mark">лидер</span>':'')+
          (pp.id===state.me?'<span class="mark mark--you">ты</span>':'')+'</span>'+
          '<span class="line"><i style="width:'+Math.max(w,3)+'%"></i></span>'+
          '<span class="hint" style="margin-top:5px;font-size:11px;opacity:.75">'+lpTxt+'</span></div>'+
        '<span class="cnt">'+pp.count+'<span>&nbsp;/&nbsp;'+goal+'</span></span></div>';
    }

    var arows='';
    for(var a=0;a<byAch.length;a++){
      arows+='<div class="arow"><em>'+two(a+1)+'</em><b>'+esc(byAch[a].name)+
        (byAch[a].role?' <span class="role">'+esc(byAch[a].role)+'</span>':'')+'</b><i>'+achTotal(byAch[a])+'</i></div>';
    }

    var posts='';
    if(!state.posts.length){ posts='<div class="empty">Пока пусто. Выложи рилс и отметься — он появится здесь.</div>'; }
    else{
      for(var k=0;k<state.posts.length;k++){
        var it=state.posts[k];
        posts+='<div class="post"><span class="pnum">'+two(parseInt(it.n,10)||0)+'</span>'+
          '<span class="pdate">'+fmtDate(it.date)+'<small>'+esc(it.url||'')+'</small></span>'+
          (it.url?'<button class="plink" data-url="'+esc(it.url)+'">Открыть</button>':'')+'</div>';
      }
    }

    /* лента отметок всех участниц */
    var feed=[];
    for(var fp=0;fp<state.participants.length;fp++){
      var who=state.participants[fp], list=dataOf(who.id).posts;
      for(var fq=0;fq<list.length;fq++){
        var itm=list[fq];
        if(!itm||!itm.url) continue;
        feed.push({name:who.name,role:who.role,date:itm.date||'',url:itm.url,n:parseInt(itm.n,10)||0,mine:who.id===state.me});
      }
    }
    feed.sort(function(a,b){ return String(b.date).localeCompare(String(a.date))||b.n-a.n; });
    var allposts='';
    if(!feed.length){ allposts='<div class="empty">Пока никто не отметился. Первый ролик появится здесь.</div>'; }
    else{
      for(var fk=0;fk<Math.min(feed.length,40);fk++){
        var f=feed[fk];
        allposts+='<div class="post"><span class="pnum">'+two(f.n)+'</span>'+
          '<span class="pdate">'+esc(f.name)+(f.mine?' · ты':'')+'<small>'+fmtDate(f.date)+' · '+esc(f.url)+'</small></span>'+
          '<button class="plink" data-url="'+esc(f.url)+'">Открыть</button></div>';
      }
    }

    var alert='';
    if(ms.due){
      alert='<div class="alert"><span class="label">Время замера</span>'+
        '<p>'+(ms.first?'Внеси стартовые показатели: подписчиков и охваты.':'Прошла неделя с последнего замера от '+fmtDate(cp[cp.length-1].date)+'.')+
        ' <b>Отметить новый рилс можно будет после обновления данных.</b></p>'+
        '<button class="cta cta--sm" id="m2">Внести данные</button></div>';
    }

    app.innerHTML=
      '<div class="brand">'+esc(c.brand||'')+'</div>'+
      (demo?'<div class="notice">data.json не загрузился — показаны встроенные примеры.<button id="retry">Обновить</button></div>':'')+
      '<figure class="cover"><img src="'+esc(c.cover||window.__COVER__)+'" alt="Афиша челленджа" onerror="this.onerror=null;this.src=window.__COVER__"></figure>'+
      '<div class="meta"><b>'+esc(c.title)+'</b><em></em>'+(when?'<span>'+when+'</span>':'')+'</div>'+
      alert+

      '<section class="panel"><div class="panel__head"><span class="label">Мой прогресс</span>'+
        '<span class="sub">'+esc(me.name)+(me.role?' · '+esc(me.role):'')+' · '+place+' место</span></div>'+
        '<div class="score"><b>'+me.count+'</b><span>/ '+goal+'</span></div>'+
        '<div class="tally">'+ticks+'</div><div class="hint">'+pace+'</div>'+
        (me.goal?'<div class="goal"><span class="label">Моя цель</span><p>'+esc(me.goal)+'</p></div>':'')+
        '<button class="alt" id="ideas">Нет идей</button>'+
        '<button class="linkbtn" id="leave">Это не я — сменить участника</button></section>'+

      '<section class="panel"><div class="panel__head"><span class="label">Достижения</span></div>'+
        '<div class="ach">'+
          '<button class="ach__i'+(me.collabs>0?' ach__i--on':'')+'" data-ach="collabs">'+icCollab()+
            '<span class="ach__t">Предложили<br>сотрудничество</span><span class="ach__n">'+me.collabs+'</span></button>'+
          '<button class="ach__i'+(me.viral>0?' ach__i--on':'')+'" data-ach="viral">'+icViral()+
            '<span class="ach__t">Рилс<br>10 000+ охвата</span><span class="ach__n">'+me.viral+'</span></button>'+
        '</div><div class="ach__hint">Нажми на иконку, чтобы засчитать</div></section>'+

      '<section class="panel"><div class="panel__head"><span class="label">Подписчики и охваты</span>'+
        '<span class="sub">'+(ms.due?'нужен замер':'замер '+fmtDate(ms.nextDate))+'</span></div>'+
        mrows+msum+'</section>'+

      '<section class="panel"><div class="panel__head"><span class="label">Рейтинг</span></div>'+rows+
        '<div class="ach__hint" style="margin-top:12px">Нажми на любую строку, чтобы посмотреть её ролики и охваты</div>'+
        (c.prize?'<div class="prize"><span class="label">Первый приз · за рилсы</span><p>'+esc(c.prize)+'</p></div>':'')+
        '<div class="prize"><span class="label">Второй приз · за достижения</span>'+
          (c.prize2?'<p style="margin-bottom:10px">'+esc(c.prize2)+'</p>':'')+arows+'</div></section>'+

      '<section class="panel"><div class="panel__head"><span class="label">Правило</span></div>'+
        '<div class="hint" style="margin-top:14px;color:var(--cream)">'+esc(c.rule)+'</div>'+
        '<div class="hint" style="margin-top:8px">'+esc(c.ruleDetail)+'</div></section>'+

      '<section class="panel"><div class="panel__head"><span class="label">Мои отметки</span></div>'+posts+'</section>'+

      '<section class="panel"><div class="panel__head"><span class="label">Отметки всех</span></div>'+allposts+'</section>'+

      '<div class="cta-wrap"><button class="cta" id="add"'+((remain===0&&!ms.due)?' disabled':'')+'>'+
        (ms.due?'Внести данные за неделю':(remain===0?'Цель закрыта':'Отметить рилс'))+'</button></div>';

    var add=document.getElementById('add');
    if(add) add.addEventListener('click',function(){ openSheet(ms.due?'metrics':'reel'); });
    ['m1','m2'].forEach(function(id){
      var b=document.getElementById(id);
      if(b) b.addEventListener('click',function(){ openSheet('metrics'); });
    });
    var ib=document.getElementById('ideas');
    if(ib) ib.addEventListener('click',function(){ openSheet('ideas'); });
    var lv=document.getElementById('leave');
    if(lv) lv.addEventListener('click',leave);
    var links=app.querySelectorAll('.plink');
    for(var g=0;g<links.length;g++) links[g].addEventListener('click',function(){ openLink(this.getAttribute('data-url')); });
    var whos=app.querySelectorAll('.row[data-who]');
    for(var y=0;y<whos.length;y++) whos[y].addEventListener('click',function(){
      whoId=this.getAttribute('data-who'); openSheet('who');
    });
    var achs=app.querySelectorAll('.ach__i');
    for(var z2=0;z2<achs.length;z2++) achs[z2].addEventListener('click',function(){ bumpAch(this.getAttribute('data-ach')); });
    var rt=document.getElementById('retry');
    if(rt) rt.addEventListener('click',function(){ location.reload(); });
  }

  function bumpAch(key){
    if(key!=='collabs'&&key!=='viral') return;
    var me=getMe(); if(!me) return;
    me[key]+=1; saveMine(); render();
    toast((key==='collabs'?'Сотрудничество · ':'Рилс 10 000+ · ')+me[key]);
    try{ window.Telegram.WebApp.HapticFeedback.impactOccurred('light'); }catch(e){}
  }

  /* ---------- шторки ---------- */
  var whoId='';
  function openSheet(mode){
    sheetIn.innerHTML=(mode==='metrics')?metricsForm():(mode==='ideas'?ideasForm():(mode==='who'?whoForm():reelForm()));
    document.body.classList.add('open');
    bindSheet(mode);
    if(mode!=='ideas'&&mode!=='who') setTimeout(function(){ var f=sheetIn.querySelector('.field'); if(f) f.focus(); },340);
  }

    var p=byId(whoId);
    if(!p) return '<div class="empty">Участница не найдена.</div><button class="cta" id="cancel" style="margin-top:22px">Закрыть</button>';

    var data=mine?{posts:state.posts,checkpoints:state.checkpoints}:(CLOUD[p.id]||{posts:[],checkpoints:[]});
    var posts=data.posts||[], cps=data.checkpoints||[];
    var out='<span class="label">'+(mine?'Это ты':'Участница')+'</span>'+
      '<h2>'+esc(p.name)+(p.role?' · '+esc(p.role):'')+'</h2>'+
      '<p>Отмечено роликов: '+p.count+' из '+state.challenge.goal+
        '. Сотрудничества: '+(p.collabs||0)+'. Рилсы 10 000+: '+(p.viral||0)+'.'+
        (p.goal?' Цель: '+esc(p.goal):'')+'</p>';
    if(cps.length){
      out+='<div class="mhead"><span>Замер</span><span>Подписчики</span><span>Охваты</span></div>';
      for(var i=0;i<cps.length;i++){
        var c=cps[i], prev=i?cps[i-1]:null;
        var df=prev?c.followers-prev.followers:null, dr=prev?c.reach-prev.reach:null;
        out+='<div class="mrow"><span class="mk"><b>'+(i===0?'Старт':'Неделя '+i)+'</b><small>'+fmtDate(c.date)+'</small></span>'+
          '<span class="mval">'+num(c.followers)+(df===null?'':'<em class="'+(df<0?'down':'')+'">'+delta(df)+'</em>')+'</span>'+
          '<span class="mval">'+num(c.reach)+(dr===null?'':'<em class="'+(dr<0?'down':'')+'">'+delta(dr)+'</em>')+'</span></div>';
      }
    } else {
      out+='<div class="mempty">Замеров пока нет.</div>';
    }
    if(posts.length){
      for(var k=0;k<posts.length;k++){
        var it=posts[k];
        out+='<div class="post"><span class="pnum">'+two(parseInt(it.n,10)||0)+'</span>'+
          '<span class="pdate">'+fmtDate(it.date)+'<small>'+esc(it.url||'')+'</small></span>'+
          (it.url?'<button class="plink" data-url="'+esc(it.url)+'">Открыть</button>':'')+'</div>';
      }
    } else {

    }
    return out+'<button class="cta" id="cancel" style="margin-top:22px">Закрыть</button>';

  function closeSheet(){ document.body.classList.remove('open'); }

  function reelForm(){
    var c=state.challenge;
    return '<span class="label">Отметка</span><h2>Ссылка на рилс</h2>'+
      '<p>'+esc(c.rule)+' '+esc(c.ruleDetail)+'</p>'+
      '<input class="field" id="link" type="url" inputmode="url" autocomplete="off" placeholder="https://www.instagram.com/reel/...">'+
      '<div class="msg" id="msg"></div>'+

      '<button class="cta" id="save">Засчитать</button><button class="ghost" id="cancel">Отмена</button>';

    return '<span class="label">'+(cp.length?'Замер недели':'Стартовый замер')+'</span><h2>Подписчики и охваты</h2>'+

      '<div class="fgroup"><label>Охваты за неделю</label>'+

    for(var i=0;i<list.length;i++)
      out+='<div class="idea"><b>'+two(i+1)+'</b><div>'+
        (list[i].cat?'<span class="cat">'+esc(list[i].cat)+'</span>':'')+
        '<strong>'+esc(list[i].title)+'</strong><small>'+esc(list[i].how)+'</small></div></div>';

  function bindSheet(mode){
    var cancel=document.getElementById('cancel');
    if(cancel) cancel.addEventListener('click',closeSheet);
    if(mode==='who'){
      var wl=sheetIn.querySelectorAll('.plink');
      for(var n=0;n<wl.length;n++) wl[n].addEventListener('click',function(){ openLink(this.getAttribute('data-url')); });
      return;
    }
    if(mode==='ideas') return;

    var msg=document.getElementById('msg');
    function fail(el,t){ if(el) el.classList.add('err'); msg.textContent=t; if(el) el.focus(); }

    if(mode==='reel'){
      var input=document.getElementById('link'), chk=document.getElementById('chk'), okBox=false;
      chk.addEventListener('click',function(){ okBox=!okBox; chk.classList.toggle('check--on',okBox); msg.textContent=''; });
      input.addEventListener('input',function(){ input.classList.remove('err'); msg.textContent=''; });
      input.addEventListener('keydown',function(e){ if(e.key==='Enter') saveReel(); });
      document.getElementById('save').addEventListener('click',saveReel);
      function saveReel(){
        var v=input.value.trim();
        if(!v){ fail(input,'Вставь ссылку на рилс.'); return; }
        if(!/^https?:\/\/.+\..+/i.test(v)){ fail(input,'Нужна ссылка целиком — начинается с https://'); return; }
        if(!okBox){ msg.textContent='Отметь галочку: засчитываются только ролики, где ты в кадре.'; return; }
        var me=getMe(); me.count+=1;
        state.posts.unshift({n:me.count,date:todayISO(),url:v});
        saveMine();
        closeSheet(); render();
        toast('Засчитано · '+me.count+' из '+state.challenge.goal);
        try{ window.Telegram.WebApp.HapticFeedback.notificationOccurred('success'); }catch(e){}
      }
    } else {
      var fol=document.getElementById('fol'), rch=document.getElementById('rch');
      [fol,rch].forEach(function(el){ el.addEventListener('input',function(){ el.classList.remove('err'); msg.textContent=''; }); });
      document.getElementById('saveM').addEventListener('click',saveMetrics);
      document.getElementById('copyJ').addEventListener('click',function(){
        copyText(exportJSON(),function(ok){ toast(ok?'data.json скопирован':'Скопировать не вышло'); });
      });
      function parseN(v){ v=String(v).replace(/[^\d]/g,''); return v===''?null:parseInt(v,10); }
      function saveMetrics(){
        var f=parseN(fol.value), r=parseN(rch.value);
        if(f===null){ fail(fol,'Впиши число подписчиков.'); return; }
        if(r===null){ fail(rch,'Впиши число охватов.'); return; }
        state.checkpoints.push({date:todayISO(),followers:f,reach:r});
        saveMine();
        closeSheet(); render();
        toast('Замер сохранён · '+num(f)+' / '+num(r));
        try{ window.Telegram.WebApp.HapticFeedback.notificationOccurred('success'); }catch(e){}
      }
    }
  }

  function exportJSON(){
    var c=state.challenge;
    return JSON.stringify({
      challenge:c, currentUserId:state.me, participants:state.participants,
      myPosts:state.posts, metrics:{checkpoints:state.checkpoints}, ideas:state.ideas
    },null,2);
  }
  function copyText(t,done){
    function fb(){
      var ta=document.createElement('textarea'); ta.value=t;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done(ok);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){done(true);},fb);
    } else fb();
  }
  function openLink(u){
    try{ if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.openLink){ window.Telegram.WebApp.openLink(u); return; } }catch(e){}
    window.open(u,'_blank','noopener');
  }
  document.getElementById('backdrop').addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

  var toastEl=document.getElementById('toast'), toastTxt=document.getElementById('toastText'), toastTimer;
  function toast(t){
    toastTxt.textContent=t; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); },2800);
  }
})();
</script>
</body>
</html>
